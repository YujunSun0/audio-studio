[project]
name = "audio-studio-backend"
version = "0.1.0"
description = "Local YouTube -> MP3 extractor and vocal/instrumental separator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "yt-dlp[default]",
    "imageio-ffmpeg>=0.5",
    "audio-separator[gpu]",
    "torch",
    "audioread>=3.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
